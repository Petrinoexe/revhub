<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>revhub</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --card2:#1b2229; --bd:#26303a;
    --fg:#e6edf3; --mut:#8b949e; --acc:#3fb950; --acc2:#2f81f7; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;letter-spacing:.5px}
  header .sp{flex:1}
  nav{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
  nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 14px;cursor:pointer;font:inherit}
  nav button.on{color:var(--fg);border-bottom-color:var(--acc)}
  main{padding:16px 18px 60px;max-width:1500px}
  input,select,textarea{background:var(--bg);border:1px solid var(--bd);color:var(--fg);font:inherit;padding:5px 7px;border-radius:4px;width:100%}
  input[type=checkbox]{width:auto}
  textarea{min-height:54px;resize:vertical}
  button.b{background:var(--card2);border:1px solid var(--bd);color:var(--fg);padding:5px 10px;border-radius:5px;cursor:pointer;font:inherit}
  button.b:hover{border-color:var(--acc2)}
  button.p{background:var(--acc2);border-color:var(--acc2);color:#fff}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .mut{color:var(--mut)}
  .pill{border:1px solid var(--bd);border-radius:999px;padding:1px 8px;color:var(--mut);white-space:nowrap}
  .pill.ok{border-color:var(--acc);color:var(--acc)}
  .pill.err{border-color:var(--err);color:var(--err);cursor:pointer}
  .pill.run{border-color:var(--warn);color:var(--warn)}
  .card{border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;background:var(--card)}
  .hd{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;user-select:none;border-radius:8px}
  .hd:hover{background:var(--card2)}
  .idx{color:var(--mut);min-width:22px}
  .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
  .sum{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .acts{display:flex;gap:4px}
  .chev{color:var(--mut);width:14px;text-align:center}
  .body{padding:4px 12px 14px;border-top:1px solid var(--bd)}
  .grp{color:var(--mut);font-size:11px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
  .f label{display:block;color:#a8b3bf;font-size:11px;margin-bottom:3px}
  .f.wide{grid-column:1/-1}
  .f input[type=checkbox]{margin-top:7px}
  .ms{display:flex;flex-wrap:wrap;gap:4px 14px}
  .ms label{display:flex;gap:5px;align-items:center;color:var(--fg);font-size:12px}
  pre{background:#0a0d12;border:1px solid var(--bd);border-radius:6px;padding:12px;overflow:auto;max-height:62vh;white-space:pre}
  .toast{position:fixed;right:16px;bottom:16px;max-width:46vw;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--acc2);padding:10px 14px;border-radius:6px;white-space:pre-wrap;z-index:9}
  .toast.err{border-left-color:var(--err)}
  dialog{background:var(--card);color:inherit;border:1px solid var(--bd);border-radius:8px;width:min(640px,calc(100vw - 32px));box-sizing:border-box}
  dialog::backdrop{background:#0008}
  dialog textarea{min-height:110px}
  .hint{color:var(--mut);font-size:12px;margin:2px 0 14px}
</style>
</head>
<body>
<header>
  <h1>revhub</h1>
  <span class="pill">вход · выход · оба</span>
  <span class="sp"></span>
  <span id="who" class="mut"></span>
  <span id="apply" class="pill" title="применение конфигурации на узлы" onclick="showApplyReport()"></span>
  <span id="status" class="mut"></span>
  <button class="b p" onclick="save()">Сохранить</button>
  <button class="b" onclick="logout()">выход</button>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<script>
const TABS = [
  ['nodes','Узлы'],['inbounds','Инбаунды'],['tunnels','Туннели'],
  ['clients','Клиенты'],['routes','Маршруты'],['check','Проверка маршрута']
];

const SCHEMA = {
  nodes: [
    {k:'id', l:'id'}, {k:'name', l:'Имя'}, {k:'role', l:'Роль', sel:['entry','exit','both']},
    {k:'public_addr', l:'Адрес для ссылок / Endpoint'}, {k:'core', l:'Юнит ядра'},
    {k:'ssh_addr', l:'SSH адрес', grp:'ssh'}, {k:'ssh_user', l:'SSH пользователь', grp:'ssh'},
    {k:'ssh_auth', l:'SSH авторизация', sel:['key','password','none'], grp:'ssh'},
    {k:'ssh_key_file', l:'SSH ключ (путь на панели)', grp:'ssh', wide:true}
  ],
  inbounds: [
    {k:'id', l:'id'}, {k:'node_id', l:'Где слушает инбаунд', ref:'nodes'}, {k:'tag', l:'Тег инбаунда'},
    {k:'name', l:'Имя'}, {k:'enabled', l:'вкл', bool:true},
    {k:'kind', l:'Протокол', sel:['vless','wireguard'], labels:{vless:'VLESS',wireguard:'WireGuard'}},
    {k:'listen', l:'listen'}, {k:'port', l:'порт', num:true},
    {k:'transport', l:'транспорт', sel:['tcp','ws','xhttp']},
    {k:'security', l:'security', sel:['reality','tls','none']},
    {k:'flow', l:'Flow', sel:['','none','xtls-rprx-vision'], labels:{'':'Авто',none:'Без Flow','xtls-rprx-vision':'Vision'}}, {k:'sni', l:'SNI / dest-домен', only:'reality'}, {k:'dest', l:'dest (host:port)', only:'reality'},
    {k:'path', l:'path'},
    {k:'cert_source', l:'Сертификат', sel:['panel','acme','acmeip','selfsigned','file'], labels:{panel:'Сертификат панели',acme:'Let’s Encrypt · домен',acmeip:'Let’s Encrypt · IP',selfsigned:'Самоподписанный',file:'Свои файлы'}, only:'tls'},
    {k:'domain', l:'Домен (для ACME и SNI)', only:'tls', sources:['acme','selfsigned','file']},
    {k:'ip', l:'IP сертификата', only:'tls', sources:['acmeip','selfsigned','file']},
    {k:'cert_file', l:'Путь к сертификату', only:'tls', sources:['file']},
    {k:'key_file', l:'Путь к ключу', only:'tls', sources:['file']},
    {k:'private_key', l:'reality private_key', wide:true, only:'reality'},
    {k:'public_key', l:'reality public_key', wide:true, only:'reality'},
    {k:'short_id', l:'reality short_id', only:'reality'}
  ],
  tunnels: [
    {k:'id', l:'id'}, {k:'name', l:'Имя (=тег)'},
    {k:'kind', l:'Вид', sel:['wg','wg-reverse','vless']},
    {k:'from_node_id', l:'From (источник трафика)', ref:'nodes'},
    {k:'to_node_id', l:'To (выпускает в интернет)', ref:'nodes'},
    {k:'enabled', l:'вкл', bool:true}, {k:'mark', l:'mark', num:true},
    {k:'subnet', l:'Подсеть'}, {k:'listen_port', l:'ListenPort', num:true},
    {k:'public_port', l:'PublicPort (если NAT)', num:true}, {k:'keepalive', l:'Keepalive', num:true},
    {k:'egress_iface', l:'Выходной интерфейс (пусто = авто)'}, {k:'forward_policy', l:'NAT на выходном узле', bool:true},
    {k:'from_key_private', l:'from priv', wide:true}, {k:'from_key_public', l:'from pub', wide:true},
    {k:'to_key_private', l:'to priv', wide:true}, {k:'to_key_public', l:'to pub', wide:true},
    {k:'uuid', l:'VLESS uuid'}, {k:'transport', l:'VLESS transport', sel:['','tcp','ws','xhttp']},
    {k:'security', l:'VLESS security', sel:['','reality','tls','none']},
    {k:'sni', l:'VLESS sni'}, {k:'dest', l:'VLESS dest'}, {k:'path', l:'VLESS path'},
    {k:'flow', l:'VLESS Flow', sel:['','none','xtls-rprx-vision'], labels:{'':'Авто',none:'Без Flow','xtls-rprx-vision':'Vision'}}, {k:'short_id', l:'VLESS short_id'},
    {k:'public_key', l:'VLESS public_key', wide:true}, {k:'private_key', l:'VLESS private_key', wide:true},
    {k:'listen_port_in', l:'VLESS порт', num:true}
  ],
  clients: [
    {k:'id', l:'id'}, {k:'email', l:'Email (метка)'}, {k:'enabled', l:'вкл', bool:true},
    {k:'expires_at', l:'Истекает (RFC3339)'}, {k:'quota_gb', l:'Квота, ГБ', num:true},
    {k:'uuid', l:'UUID', wide:true}, {k:'flow', l:'Flow', sel:['','none','xtls-rprx-vision'], labels:{'':'Как в инбаунде',none:'Без Flow','xtls-rprx-vision':'Vision'}}, {k:'sub_token', l:'sub_token', wide:true},
    {k:'inbounds', l:'Инбаунды клиента', multi:'inbounds', wide:true}
  ],
  routes: [
    {k:'id', l:'id'}, {k:'name', l:'Имя'}, {k:'enabled', l:'вкл', bool:true},
    {k:'node_id', l:'Узел (пусто = все)', ref:'nodes'}, {k:'outbound', l:'Исходящий', outbound:true},
    {k:'user', l:'Пользователи', multi:'users', wide:true},
    {k:'inbound', l:'Входящие инбаунды', multi:'route-inbounds', wide:true},
    {k:'domain', l:'Домены: full: / domain: / regexp: / geosite:', lines:true, wide:true},
    {k:'ip', l:'IP / CIDR / geoip:', lines:true, wide:true},
    {k:'port', l:'Порты (80,443,1000-2000)'},
    {k:'network', l:'Сеть', sel:['','tcp','udp','tcp,udp']}
  ]
};

const GROUPS = {
  nodes: [['Основное',['id','name','role','public_addr','core']],
          ['Управление по SSH',['ssh_addr','ssh_user','ssh_auth','ssh_key_file']]],
  inbounds: [['Основное',['id','node_id','tag','name','enabled','kind']],
             ['Подключение',['listen','port']],
             ['VLESS',['transport','security','flow','path']],
             ['TLS',['cert_source','domain','ip','cert_file','key_file']],
             ['Reality',['sni','dest','private_key','public_key','short_id']]],
  tunnels: [['Основное',['id','name','kind','from_node_id','to_node_id','enabled','mark']],
            ['WireGuard',['subnet','listen_port','public_port','keepalive','egress_iface','forward_policy',
                          'from_key_private','from_key_public','to_key_private','to_key_public']],
            ['VLESS',['uuid','transport','security','sni','dest','path','flow','short_id',
                      'public_key','private_key','listen_port_in']]],
  clients: [['Основное',['id','email','enabled','expires_at','quota_gb']],
            ['Ключи',['uuid','flow','sub_token']],
            ['Доступ',['inbounds']]],
  routes: [['Условия',['user','inbound','domain','ip','port','network']],
           ['Куда и где',['node_id','outbound','enabled']]]
};

let ST = null, TAB = 'nodes', TOAST = '', TOASTERR = false, APPLY = null;
let LOCAL_NODE = '', PANEL_TLS = false;
const OPEN = new Set();   // ключи раскрытых карточек

async function api(path, opt){
  const r = await fetch(path, opt);
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){ j = {raw:txt}; }
  if(r.status === 401){ location.href = '/login'; throw new Error('нужен вход'); }
  if(!r.ok) throw new Error((j && (j.lines||[j.error]||j.raw)) ? [].concat(j.lines||j.error||j.raw).join('\n') : txt);
  return j;
}
function toast(msg, err){ TOAST = msg; TOASTERR = !!err; renderToast(); setTimeout(()=>{TOAST='';renderToast();}, err?9000:2500); }
function renderToast(){
  let el = document.getElementById('toast');
  if(!TOAST){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.className = 'toast' + (TOASTERR?' err':''); el.textContent = TOAST;
}

async function boot(){
  try{
    const me = await api('/api/me');
    LOCAL_NODE = me.local_node || '';
    PANEL_TLS = !!me.panel_tls;
    document.getElementById('who').textContent = me.noauth ? 'без пароля (--noauth)' : (me.user||'');
  }catch(e){ return; }
  await load();
  refreshApply();
}
async function load(){ ST = await api('/api/state'); render(); }
async function save(){
  try{
    ST = await api('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(ST)});
    toast('Сохранено, применяю на узлы…');
  }catch(e){ toast('Не сохранилось:\n'+e.message, true); }
  render();
  waitApply();
}
async function logout(){
  try{ await api('/api/logout',{method:'POST'}); }catch(e){}
  location.href = '/login';
}

function esc(v){ return (v===undefined||v===null)?'':String(v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function plural(n, one, few, many){
  const n10 = n % 10, n100 = n % 100;
  const w = (n10===1 && n100!==11) ? one : (n10>=2 && n10<=4 && (n100<10 || n100>=20)) ? few : many;
  return n + ' ' + w;
}
function nodeLabel(id){ const n=(ST.nodes||[]).find(x=>x.id===id); return n?(n.name||n.id):(id||'—'); }
function outboundOptions(nodeId){
  return ['direct','block', ...(ST.tunnels||[]).filter(x=>x.enabled && (!nodeId || x.from_node_id===nodeId)).map(x=>'tun:'+x.name)];
}
function inboundChoices(nodeId){
  return [
    ...(ST.inbounds||[]).filter(x=>x.tag && (!nodeId || x.node_id===nodeId)).map(x=>[x.tag, `${x.name || x.tag} (${nodeLabel(x.node_id)} · ${x.tag})`]),
    ...(ST.tunnels||[]).filter(x=>x.kind==='vless' && (!nodeId || x.to_node_id===nodeId)).map(x=>['tun:'+x.name, `${x.name} (приём · ${nodeLabel(x.to_node_id)})`])
  ];
}
function memberOptions(r, kind){
  if(kind==='users') return (ST.clients||[]).filter(c=>c.email).map(c=>[c.email,c.email]);
  if(kind==='route-inbounds'){
    const tunnel = (ST.tunnels||[]).find(t=>'tun:'+t.name===r.outbound && t.enabled);
    return inboundChoices(r.node_id || tunnel?.from_node_id);
  }
  return (ST.inbounds||[]).map(x=>[x.id, `${x.name || x.tag || x.id} (${x.kind==='wireguard'?'WireGuard':'VLESS'})`]);
}

function render(){
  document.getElementById('nav').innerHTML = TABS.map(([k,l])=>
    `<button class="${k===TAB?'on':''}" onclick="TAB='${k}';render()">${l}</button>`).join('');
  const st = document.getElementById('status');
  st.textContent = ST ? `${plural((ST.nodes||[]).length,'узел','узла','узлов')} · ${plural((ST.tunnels||[]).length,'туннель','туннеля','туннелей')} · ${plural((ST.clients||[]).length,'клиент','клиента','клиентов')} · ${plural((ST.routes||[]).length,'правило','правила','правил')}` : 'загрузка…';
  const v = document.getElementById('view');
  if(!ST){ v.textContent='загрузка…'; return; }
  if(TAB==='check') return renderCheck(v);
  renderList(v);
}

// ---------- применение: сохранение = конфиг уже на узлах

function renderApplyBar(){
  const el = document.getElementById('apply');
  if(!el) return;
  if(!APPLY){ el.textContent = ''; el.className = 'pill'; return; }
  const bad = (APPLY.nodes||[]).filter(n=>!n.ok && !n.skipped);
  if(APPLY.running){ el.textContent = '⟳ применяю…'; el.className = 'pill run'; }
  else if(bad.length){ el.textContent = `✗ не применилось: ${bad.length} · подробности`; el.className = 'pill err'; }
  else if((APPLY.nodes||[]).length){ el.textContent = '✓ применено'; el.className = 'pill ok'; }
  else { el.textContent = ''; el.className = 'pill'; }
}
function applyText(){
  if(!APPLY) return '';
  const L = [];
  if(APPLY.running) L.push('идёт применение…');
  if(APPLY.finished_at) L.push('закончено: ' + APPLY.finished_at.replace('T',' ').slice(0,19) + 'Z');
  for(const n of APPLY.nodes||[]){
    const mark = n.skipped ? '·' : (n.ok ? '✓' : '✗');
    L.push(`${mark} ${n.name || n.node_id}${n.local?' (эта машина)':''}${n.err?' — '+n.err:''}`);
    if(n.output) L.push(indent(n.output));
  }
  for(const w of APPLY.warnings||[]) L.push('⚠ ' + w);
  return L.join('\n');
}
function indent(t){
  return String(t).split('\n').map(s=>'    '+s).join('\n');
}
function showApplyReport(){
  const d = document.createElement('dialog');
  d.innerHTML = `<form method="dialog"><div class="hint">Что сделала панель после сохранения: локальный узел применён через sudo, удалённые — по SSH.</div>
    <pre style="max-height:52vh">${esc(applyText() || 'пока нечего показать')}</pre>
    <div class="row"><button class="b p">Закрыть</button></div></form>`;
  d.addEventListener('close',()=>d.remove(),{once:true});
  document.body.appendChild(d);
  d.showModal();
}
async function refreshApply(){
  try{ APPLY = await api('/api/apply'); }catch(e){ return; }
  renderApplyBar();
}
async function waitApply(){
  for(let i=0;i<240;i++){
    try{ APPLY = await api('/api/apply'); }catch(e){ return; }
    renderApplyBar();
    if(APPLY && !APPLY.running) break;
    await new Promise(r=>setTimeout(r,700));
  }
  const bad = ((APPLY&&APPLY.nodes)||[]).filter(n=>!n.ok && !n.skipped);
  if(bad.length){
    toast('применено не всё:\n' + bad.map(n=>`${n.name||n.node_id}: ${n.err}`).join('\n'), true);
  } else if(APPLY && !APPLY.running){
    toast('применено ✓');
  }
  await load();
}
async function applyNode(i){
  const n = ST.nodes[i];
  toast('применяю конфиг на ' + (n.name||n.id) + '…');
  try{
    await api('/api/apply', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({node:n.id})});
    toast('применено на ' + (n.name||n.id));
  }catch(e){ toast('не применилось:\n'+e.message, true); }
  await load(); refreshApply();
}
async function diagNode(i){
  const n = ST.nodes[i];
  toast('проверяю ' + (n.name||n.id) + '…');
  try{
    const d = await api('/api/node/diag', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({node:n.id})});
    const dlg = document.createElement('dialog');
    const lines = (d.items||[]).map(it=>{
      const mark = it.ok ? (it.warn?'⚠':'✓') : '✗';
      return `${mark} ${it.name}${it.out?': '+it.out:''}${it.hint?'\n     → '+it.hint:''}`;
    });
    dlg.innerHTML = `<form method="dialog"><div class="hint">Проверка узла «${esc(n.name||n.id)}»${d.local?' (эта машина)':' по SSH'}.</div>
      <pre style="max-height:56vh">${esc(lines.join('\n') || 'нет данных')}</pre>
      <div class="row"><button class="b p">Закрыть</button></div></form>`;
    dlg.addEventListener('close',()=>dlg.remove(),{once:true});
    document.body.appendChild(dlg); dlg.showModal();
  }catch(e){ toast('проверка не удалась:\n'+e.message, true); }
}
function tunnelPing(i){
  const t = ST.tunnels[i];
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form method="dialog"><div class="hint">Туннель «${esc(t.name||t.id)}»: ${esc(t.from_node_id)} → ${esc(t.to_node_id)}.
      Проверяются рукопожатие WireGuard, пинг дальнего конца по интерфейсу и пинг хоста через выходной узел.</div>
    <div class="f"><label for="ph">Пинговать через туннель</label><input id="ph" value="1.1.1.1"></div>
    <div class="row"><button class="b p" type="button" onclick="runTunnelPing('${esc(t.id)}')">Проверить</button>
      <button class="b" type="button" onclick="this.closest('dialog').close()">Закрыть</button></div>
    <pre id="po" style="max-height:50vh">—</pre></form>`;
  dlg.addEventListener('close',()=>dlg.remove(),{once:true});
  document.body.appendChild(dlg); dlg.showModal();
}
async function runTunnelPing(id){
  const out = document.getElementById('po'), host = (document.getElementById('ph')||{}).value || '';
  if(out) out.textContent = 'проверяю…';
  try{
    const r = await api('/api/tunnel/ping', {method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({tunnel:id, host:host.trim()})});
    const lines = (r.items||[]).map(it=>{
      const mark = it.ok ? (it.warn?'⚠':'✓') : '✗';
      return `${mark} ${it.name}${it.out?':\n'+indent(it.out):''}${it.hint?'\n     → '+it.hint:''}`;
    });
    if(out) out.textContent = lines.join('\n\n') || 'нет данных';
  }catch(e){ if(out) out.textContent = 'ошибка: ' + e.message; }
}

function keyOf(r,i){ return r.id || ('i'+i); }

function renderList(v){
  const rows = ST[TAB]||[];
  let html = `<div class="row"><button class="b" onclick="addRow('${TAB}')">+ добавить</button>
    <span class="mut">${hintFor(TAB)}</span></div>`;
  if(TAB==='nodes') html += wizardHTML();
  if(!rows.length) html += '<div class="mut">пока пусто</div>';
  rows.forEach((r,i)=>{
    const key = keyOf(r,i), open = OPEN.has(key);
    html += `<div class="card">
      <div class="hd" onclick="toggleOpen('${esc(key)}')">
        <span class="idx">${i+1}</span>
        <span class="ttl">${esc(titleOf(TAB,r))}</span>
        <span class="sum">${esc(summaryOf(TAB,r))}</span>
        ${actions(TAB,i,r)}
        <span class="chev">${open?'▾':'▸'}</span>
      </div>`;
    if(open) html += `<div class="body">${bodyOf(TAB,i,r)}</div>`;
    html += '</div>';
  });
  v.innerHTML = html;
}

function titleOf(tab,r){
  switch(tab){
    case 'nodes': return r.name || r.id || '(узел)';
    case 'inbounds': return r.tag || '(инбаунд)';
    case 'tunnels': return r.name || '(туннель)';
    case 'clients': return r.email || '(клиент)';
    case 'routes': return r.name || '(правило)';
  }
  return r.id || '';
}

function summaryOf(tab,r){
  switch(tab){
    case 'nodes': {
      const st = r.status==='alive' ? `● SSH доступен${r.latency_ms?' '+r.latency_ms+' мс':''}`
               : r.status==='dead' ? '○ SSH недоступен' : '◌ SSH не проверялся';
      const hs = (r.handshake_age>=0) ? 'handshake '+r.handshake_age+' с' : '';
      return [st, r.role||'both', r.public_addr||'адрес не задан',
              r.mgmt_via?('via '+r.mgmt_via):'', hs,
              r.last_check?('проверен '+r.last_check.slice(11,19)):''].filter(Boolean).join(' · ');
    }
    case 'inbounds':
      return [nodeLabel(r.node_id), r.kind==='wireguard'?'WireGuard / UDP':'VLESS / '+(r.transport||'tcp')+'/'+(r.security||'none'),
              ':'+(r.port||'?'), r.enabled?'':'выключен'].filter(Boolean).join(' · ');
    case 'tunnels': {
      const who = r.kind==='wg' ? 'слушает '+(r.to_node_id||'?') : 'слушает '+(r.from_node_id||'?');
      return [(r.from_node_id||'?')+' → '+(r.to_node_id||'?'), who,
              r.kind==='vless'?'':'mark '+(r.mark||'?'), r.enabled?'':'выключен'].filter(Boolean).join(' · ');
    }
    case 'clients': {
      const q = [plural((r.inbounds||[]).length,'инбаунд','инбаунда','инбаундов')];
      if(r.expires_at) q.push('до '+r.expires_at);
      if(r.quota_gb) q.push(r.quota_gb+' ГБ');
      if(!r.enabled) q.push('выключен');
      return q.join(' · ');
    }
    case 'routes': {
      const cond = [];
      if((r.user||[]).length) cond.push('user:'+r.user.join(','));
      if((r.inbound||[]).length) cond.push('in:'+r.inbound.join(','));
      if((r.domain||[]).length) cond.push(plural(r.domain.length,'домен','домена','доменов'));
      if((r.ip||[]).length) cond.push('ip:'+r.ip.length);
      if(r.port) cond.push('port:'+r.port);
      if(r.network) cond.push(r.network);
      return (cond.length?cond.join(' '):'любой запрос') + ' → ' + (r.outbound||'?')
             + (r.node_id?' @'+nodeLabel(r.node_id):'') + (r.enabled?'':' · выключено');
    }
  }
  return '';
}

function actions(tab,i,r){
  const stop = 'event.stopPropagation();';
  let b = '';
  if(tab==='inbounds' && r.kind!=='wireguard' && r.security==='reality') b += `<button class="b" title="ключи reality" onclick="${stop}genReality(${i})">🔑</button>`;
  if(tab==='tunnels') b += `<button class="b" title="ключи WireGuard" onclick="${stop}genWG(${i})">🔑</button>
    <button class="b" title="проверить пинг по туннелю" onclick="${stop}tunnelPing(${i})">📶</button>`;
  if(tab==='clients') b += `<button class="b" title="UUID" onclick="${stop}genUUID(${i})">🆔</button>
    <button class="b" title="токен подписки" onclick="${stop}genToken(${i})">🎫</button>
    <button class="b" title="ссылки подписки" onclick="${stop}subLinks(${i})">sub</button>`;
  if(tab==='nodes'){
    b += `<button class="b" title="проверить сейчас" onclick="${stop}checkNodes()">🔍</button>`;
    b += `<button class="b" title="применить конфиг на узле" onclick="${stop}applyNode(${i})">⚙</button>
      <button class="b" title="диагностика узла" onclick="${stop}diagNode(${i})">🩺</button>`;
  }
  if(tab==='routes') b += `<button class="b" title="выше" onclick="${stop}moveRow(${i},-1)">↑</button>
    <button class="b" title="ниже" onclick="${stop}moveRow(${i},1)">↓</button>`;
  b += `<button class="b" title="удалить" onclick="${stop}delRow('${tab}',${i})">✕</button>`;
  return `<span class="acts" onclick="event.stopPropagation()">${b}</span>`;
}

function bodyOf(tab,i,r){
  let html = '';
  for(const [title,keys] of GROUPS[tab]){
    if(tab==='inbounds' && r.kind==='wireguard' && ['VLESS','TLS','Reality'].includes(title)) continue;
    if(tab==='tunnels'){
      if(title==='WireGuard' && r.kind==='vless') continue;
      if(title==='VLESS' && r.kind!=='vless') continue;
    }
    const fields = SCHEMA[tab].filter(f=>keys.includes(f.k))
      .filter(f=>(!f.only || r.security===f.only) && (!f.sources || f.sources.includes(r.cert_source)));
    if(!fields.length) continue;
    html += `<div class="grp">${title}</div><div class="grid">`;
    for(const f of fields){
      html += `<div class="f${f.wide?' wide':''}"><label>${f.l}</label>${cell(tab,i,r,f)}</div>`;
    }
    html += '</div>';
  }
  if(tab==='inbounds' && r.kind==='wireguard'){
    const wg = r.wireguard || {};
    html += `<div class="grp">WireGuard</div><div class="grid">
      <div class="f"><label>Подсеть клиентов</label><input value="${esc(wg.subnet || '10.88.0.0/24')}" onchange="setWGSubnet(${i},this.value.trim())"></div>
      <div class="f wide"><label>Публичный ключ сервера</label><input readonly value="${esc(wg.public_key)}" placeholder="Генерируется при сохранении"></div>
    </div>`;
  }
  if(tab==='clients'){
    const addresses = (r.inbounds||[]).map(id=>{
      const inbound = (ST.inbounds||[]).find(x=>x.id===id);
      const peer = r.wireguard?.[id];
      return inbound?.kind==='wireguard' && peer ? `${inbound.tag}: ${peer.address}` : '';
    }).filter(Boolean);
    if(addresses.length) html += `<div class="hint">WireGuard: ${esc(addresses.join(' · '))}</div>`;
    html += `<div class="hint">UUID, токен подписки и ключи выбранных WireGuard-инбаундов заполняются при сохранении. Кнопка «sub» открывает ссылки.</div>`;
  }
  return html;
}

function cell(tab,i,r,f){
  const val = r[f.k];
  const on = `onchange="edit('${tab}',${i},'${f.k}',this)"`;
  if(f.bool) return `<input type="checkbox" ${val?'checked':''} ${on}>`;
  if(f.sel){
    const panelAvailable = PANEL_TLS && r.node_id===LOCAL_NODE;
    const visionAvailable = tab==='clients' || ((!r.transport || r.transport==='tcp') && ['tls','reality',''].includes(r.security||''));
    const unavailable = o => (o==='panel' && !panelAvailable) || (o==='xtls-rprx-vision' && !visionAvailable);
    const opts = f.sel.filter(o=>!unavailable(o) || val===o);
    return `<select ${on}>${opts.map(o=>`<option ${o===val?'selected':''} ${unavailable(o)?'disabled':''} value="${esc(o)}">${esc(f.labels?.[o]||o||'—')}</option>`).join('')}</select>`;
  }
  if(f.ref){
    const opts = ['',...(ST[f.ref]||[]).map(n=>n.id)];
    return `<select ${on}>${opts.map(o=>`<option ${o===val?'selected':''} value="${esc(o)}">${o?esc(nodeLabel(o)):'—'}</option>`).join('')}</select>`;
  }
  if(f.outbound){
    const opts = outboundOptions(r.node_id);
    if(val && !opts.includes(val)) opts.push(val);
    return `<select ${on}>${opts.map(o=>`<option ${o===val?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
  }
  if(f.multi){
    const chosen = val||[];
    const pool = new Map(memberOptions(r, f.multi));
    for(const value of chosen){ if(!pool.has(value)) pool.set(value, value+' (вне выбора)'); }
    if(!pool.size) return '<span class="mut">нет доступных вариантов</span>';
    return '<div class="ms">' + [...pool].map(([id,label])=>{
      return `<label><input type="checkbox" value="${esc(id)}" ${chosen.includes(id)?'checked':''}
        onchange="toggleMember('${tab}',${i},'${f.k}',this.value,this.checked)"> ${esc(label)}</label>`;
    }).join('') + '</div>';
  }
  if(f.lines) return `<textarea ${on}>${esc((val||[]).join('\n'))}</textarea>`;
  return `<input value="${esc(val)}" ${f.num?'type="number"':''} ${on}>`;
}

function edit(tab,i,key,el){
  let v;
  if(el.type==='checkbox') v = el.checked;
  else if(el.type==='number') v = Number(el.value)||0;
  else {
    const f = SCHEMA[tab].find(x=>x.k===key);
    v = (f && f.lines) ? el.value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean) : el.value;
  }
  const row = ST[tab][i];
  ST[tab][i][key] = v;
  if(tab==='inbounds' && key==='node_id' && row.cert_source==='panel' && v!==LOCAL_NODE){
    row.cert_source='acme';
    Object.assign(row,{cert_file:'',key_file:'',sni:'',self_signed:false});
  }
  if(tab==='inbounds' && key==='cert_source'){
    Object.assign(row,{cert_file:'',key_file:'',sni:'',self_signed:v==='selfsigned'});
  }
  if(key==='kind' && tab==='inbounds'){
    if(v==='wireguard' && row.port===443) row.port=nextWGPort(row);
    if(v==='vless' && row.port===51820) row.port=443;
  }
  if(['kind','security','cert_source','transport'].includes(key) || (tab==='routes' && ['node_id','outbound'].includes(key)) || (tab==='inbounds' && key==='node_id')){ render(); return; }
  if(key==='enabled' || key==='node_id' || key==='outbound' || key==='mark'){ refreshHeader(); return; }
}
function refreshHeader(){
  const rows = ST[TAB]||[];
  document.querySelectorAll('#view .card').forEach((card,idx)=>{
    const r = rows[idx]; if(!r) return;
    card.querySelector('.ttl').textContent = titleOf(TAB,r);
    card.querySelector('.sum').textContent = summaryOf(TAB,r);
  });
}
function setWGSubnet(i,subnet){
  const inbound = ST.inbounds[i];
  inbound.wireguard = {...inbound.wireguard, subnet};
}
function nextWGPort(inbound){
  const ports = new Set((ST.inbounds||[]).filter(x=>x!==inbound && x.enabled && x.kind==='wireguard' && x.node_id===inbound.node_id).map(x=>x.port));
  for(const t of ST.tunnels||[]){
    if(!t.enabled || !['wg','wg-reverse'].includes(t.kind)) continue;
    const listener = t.kind==='wg' ? t.to_node_id : t.from_node_id;
    if(listener===inbound.node_id) ports.add(t.listen_port || 51820);
  }
  let port=51820;
  while(ports.has(port) && port<65535) port++;
  return port;
}
function toggleMember(tab,i,key,id,checked){
  const r = ST[tab][i];
  const list = new Set(r[key]||[]);
  checked ? list.add(id) : list.delete(id);
  r[key] = [...list];
  refreshHeader();
}
function toggleOpen(key){ OPEN.has(key) ? OPEN.delete(key) : OPEN.add(key); render(); }

function addRow(tab){
  const el = {};
  for(const f of SCHEMA[tab]){
    if(f.bool) el[f.k] = true;
    else if(f.num) el[f.k] = 0;
    else if(f.lines || f.multi) el[f.k] = [];
    else if(f.sel) el[f.k] = f.sel[0];
    else el[f.k] = '';
  }
  el.id = tab.slice(0,2) + '-' + Math.random().toString(16).slice(2,6);
  if(tab==='nodes'){ el.role='both'; el.core='xray'; el.public_addr='host.example.com:443'; }
  if(tab==='inbounds'){
    el.node_id = ST.nodes?.find(n=>n.id===LOCAL_NODE)?.id || ST.nodes?.[0]?.id || '';
    el.listen='0.0.0.0'; el.port=443; el.transport='tcp'; el.security='tls';
    el.cert_source=PANEL_TLS && el.node_id===LOCAL_NODE?'panel':'acme';
  }
  if(tab==='tunnels'){ el.kind='wg-reverse'; el.enabled=true; el.keepalive=25; el.listen_port=51820; el.forward_policy=true; }
  if(tab==='clients'){ el.enabled=true; }
  if(tab==='routes'){ el.enabled=true; el.outbound='direct'; }
  (ST[tab] = ST[tab]||[]).push(el);
  OPEN.add(el.id);
  render();
}
function delRow(tab,i){ const r=ST[tab][i]; if(r) OPEN.delete(keyOf(r,i)); ST[tab].splice(i,1); render(); }
function moveRow(i,dir){
  const a = ST.routes, j = i+dir;
  if(j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]]; render();
}

function wizTLS(){
  const by = val('w_tlsby');
  document.getElementById('w_domain_f').hidden = by!=='domain';
  document.getElementById('w_email_f').hidden  = by==='ip';      // нужен для acme и acme.sh-на-IP
  document.getElementById('w_ip_f').hidden     = by==='domain';
  const hint = by==='ip-le'
    ? 'порт 80 у выходного должен быть свободен и доступен извне: Let\'s Encrypt проверяет по HTTP-01'
    : (by==='ip' ? 'публичные CA такие сертификаты не выдают: клиенту нужен allowInsecure или пин' : '');
  const el = document.getElementById('w_tlshint');
  if(el) el.textContent = hint;
}

async function provisionAdd(){
  const btn = document.getElementById('w_go'), log = document.getElementById('w_log');
  const body = {
    name: val('w_name'), addr: val('w_addr'), hub_node_id: val('w_hub'),
    ssh_user: val('w_user')||'root', ssh_password: val('w_pass'), ssh_key_file: val('w_key'),
    tls_by: val('w_tlsby'), domain: val('w_domain'), ip: val('w_ip'), acme_email: val('w_email'),
    tunnel_kind: val('w_kind'),
    port: Number(val('w_vport'))||443, wg_port: Number(val('w_wg'))||51820,
    apply_local: false
  };
  if(body.ssh_key_file){
    body.ssh_addr = body.addr + ':' + (val('w_port')||'22');
  } else {
    body.ssh_addr = body.addr + ':' + (val('w_port')||'22');
  }
  btn.disabled = true; btn.textContent = 'ставлю…';
  log.style.display='block'; log.textContent = 'подключаюсь по SSH и ставлю…';
  try{
    const rep = await api('/api/node/provision', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
    await load();
    const report = document.getElementById('w_log');
    if(report){
      report.style.display='block';
      report.textContent = (rep.steps||[]).join('\n') + '\n\n' + (rep.bootstrap||'');
    }
    await waitApply();
  }catch(e){
    log.textContent = 'ошибка: ' + e.message;
    toast('установка не удалась', true);
  }finally{ btn.disabled = false; btn.textContent = 'Поставить и связать'; }
}

async function reinstallNode(i){

  toast('ставлю на ' + (n.ssh_addr||n.id) + '…');
  try{
    const rep = await api('/api/node/provision', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({node_id: n.id, apply_local:false})});

}

}
async function genWG(i){
  const a = await api('/api/gen?what=wg',{method:'POST'}), b = await api('/api/gen?what=wg',{method:'POST'});

  render(); toast('ключи WireGuard подставлены — не забудь сохранить');

  <div class="row">
    <select id="cnode" style="width:auto" onchange="updateCheckInbounds()">${nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.name||n.id)}</option>`).join('')}</select>
    <select id="cinbound" aria-label="Входящий инбаунд" style="width:auto;max-width:100%"></select>
    <select id="cuser" aria-label="Пользователь" style="width:auto;max-width:100%"><option value="">Любой пользователь</option>${memberOptions({},'users').map(([value,label])=>`<option value="${esc(value)}">${esc(label)}</option>`).join('')}</select>
    <input id="cdomain" placeholder="домен" style="width:190px">
    <input id="cip" placeholder="IP" style="width:140px">
    <input id="cport" placeholder="порт" style="width:80px">
    <select id="cnet" style="width:auto"><option value="">—</option><option>tcp</option><option>udp</option></select>
    <button class="b p" onclick="checkRoute()">Проверить</button>
  </div>
  <pre id="out">—</pre>`;
  updateCheckInbounds();
}
function updateCheckInbounds(){
  const choices = new Map(inboundChoices(val('cnode')));
  document.getElementById('cinbound').innerHTML = '<option value="">Любой инбаунд</option>' + [...choices].map(([value,label])=>`<option value="${esc(value)}">${esc(label)}</option>`).join('');
}
async function checkRoute(){
  const q = new URLSearchParams({
    node: document.getElementById('cnode').value,
    inbound: document.getElementById('cinbound').value,
    user: document.getElementById('cuser').value,
    domain: document.getElementById('cdomain').value,
    ip: document.getElementById('cip').value,
    port: document.getElementById('cport').value,
    network: document.getElementById('cnet').value
  });
  try{
    const d = await api('/api/route-check?'+q);
    let txt = d.matched
      ? `правило №${d.rule_num} «${d.rule_name}» → ${d.outbound}\nпричина: ${d.reason}`
      : `точного матча нет → сработает ${d.outbound}\n${d.reason}`;
    if(d.uncertain && d.uncertain.length){
      txt += '\n\n⚠ выше стоят правила с непроверяемыми локально условиями — могут перехватить:\n'
        + d.uncertain.map(u=>`   №${u.rule_num} «${u.rule_name}» (${u.why})`).join('\n');
    }
    document.getElementById('out').textContent = txt;
  }catch(e){ toast(e.message,true); }
}

boot();
</script>
</body>
</html>
